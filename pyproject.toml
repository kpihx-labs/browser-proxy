[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "browser-proxy"
version = "0.2.0"
description = "KpihX unified Edge CDP daemon and JSON-RPC CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KpihX", email = "kapoivha@gmail.com" }]
dependencies = [
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "websockets>=15,<16",
]

[project.scripts]
browser-proxy = "browser_proxy.cli:app"

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.4", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["ASYNC221", "B010", "I001", "TRY004", "UP047"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
